name: master-overlay-apk

on:
  push:
    branches: [master-overlay-build]
    paths:
      - 'apps/master-overlay/**'
      - '.github/workflows/master-overlay-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/master-overlay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: master-bot-overlay-apk
          path: |
            apps/master-overlay/app/build/outputs/apk/debug/app-debug.apk
            apps/master-overlay/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
