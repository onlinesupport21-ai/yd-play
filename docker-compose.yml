services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ydplay
      POSTGRES_USER: ydplay
      POSTGRES_PASSWORD: ydplay_dev
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ydplay -d ydplay"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ydplay_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://ydplay:ydplay_dev@postgres:5432/ydplay
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-change-me}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-replace-with-at-least-24-random-characters}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-replace-with-at-least-32-random-characters}
      ADMIN_ACCESS_TOKEN_TTL_SECONDS: ${ADMIN_ACCESS_TOKEN_TTL_SECONDS:-1800}
      PUSH_TOKEN_ENCRYPTION_KEY: ${PUSH_TOKEN_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      PUSH_PROVIDER_URL: ${PUSH_PROVIDER_URL:-}
      PUSH_PROVIDER_BEARER_TOKEN: ${PUSH_PROVIDER_BEARER_TOKEN:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3002}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["3000:3000"]

  realtime:
    build:
      context: .
      dockerfile: services/realtime/Dockerfile
    environment:
      NODE_ENV: development
      REALTIME_PORT: 3001
      DATABASE_URL: postgresql://ydplay:ydplay_dev@postgres:5432/ydplay
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-change-me}
      REALTIME_ALLOWED_ORIGINS: ${REALTIME_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["3001:3001"]

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_YD_API_URL: ${NEXT_PUBLIC_YD_API_URL:-http://localhost:3000/v1}
    depends_on:
      - api
    ports: ["3002:3000"]

volumes:
  ydplay_pg:
